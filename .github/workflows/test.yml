# 올릴 때마다 맥과 윈도우에서 시험을 돌린다 — 한쪽에서만 되는 변경이 섞이지 않게.
name: test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # 맥 알림 명령(osascript)이 진짜 맥에서 문법 오류 없이 도는지. 화면 없는 시험 기계라 알림이 실제로 보이는지는 여기서 알 수 없다
      - name: mac notification command runs
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          node --input-type=module -e 'import { notifyCommand } from "./server/report.mjs"; import { execFileSync } from "node:child_process"; const c = notifyCommand(process.platform, "팀장 보고", "업무 1건 끝났습니다"); execFileSync(c.cmd, c.args, { stdio: "inherit" }); console.log("NOTIFY_COMMAND_OK");'
